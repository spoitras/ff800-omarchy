# Bridge PipeWire desktop audio into the real JACK server (jackd + FFADO).
#
# Architecture: jackd owns the FF800 via its FFADO backend and keeps the
# hardware stream open for its whole lifetime. PipeWire connects as an ordinary
# JACK *client*. This avoids libpipewire-module-ffado-driver entirely, and with
# it the use-after-free that crashed PipeWire whenever the last client
# disconnected (PipeWire closes hardware streams on disconnect by design).
#
# Requires jackd to already be running -- managed by the `ff800` helper.

context.modules = [
    {   name = libpipewire-module-jack-tunnel
        flags = [ ifexists nofail ]
        args = {
            jack.client-name = "PipeWire"
            tunnel.mode      = duplex
            jack.connect     = true
            audio.channels   = 2
            audio.position   = [ FL FR ]
            jack.connect-audio = [
                "firewire_pcm:000a35005b685205_pbk_analog-1_out"
                "firewire_pcm:000a35005b685205_pbk_analog-2_out"
            ]
            sink.props = {
                node.description = "Fireface 800 (JACK) Output"
            }
            source.props = {
                node.description = "Fireface 800 (JACK) Input"
            }
        }
    }
]
